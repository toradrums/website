<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tora Drums | Dùi trống có chữ ký & Áo phông</title>
<meta name="description" content="Tora Drums: TikTok, YouTube, Instagram, dùi trống có chữ ký, áo phông và ủng hộ qua QR.">
<meta property="og:title" content="Tora Drums">
<meta property="og:image" content="https://cdn.beacons.ai/user_content/2uNdRCLtw5OeQIhze6aneVdw8kM2/profile_toradrums.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fde8ee; --card:#fff8fa; --rose:#be3a5e; --rose-d:#8f2644; --rose-l:#f7c6d4;
  --ink:#3b1421; --muted:#7d4a5b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#2a0f19; --card:#3a1523; --rose:#f08aa8; --rose-d:#ffb3c8; --rose-l:#6b2840; --ink:#ffe9ef; --muted:#e2aebd}
}
*{box-sizing:border-box;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:24px 14px 40px;display:flex;justify-content:center}
.wrap{width:100%;max-width:480px;border:3px solid var(--rose);border-radius:28px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--rose-l)}
.box{border:2px solid var(--rose);border-radius:18px;background:var(--card);overflow:hidden}
.head{padding:22px 16px 18px;text-align:center}
.head img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid var(--rose);padding:3px;background:var(--card)}
h1{font-size:1.5rem;font-weight:800;margin-top:12px;color:var(--rose-d)}
.head p{color:var(--muted);font-size:.92rem;margin-top:4px}
.social{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.social a{display:flex;align-items:center;gap:7px;padding:8px 14px;border:2px solid var(--rose);border-radius:999px;color:var(--rose-d);font-weight:700;font-size:.88rem;text-decoration:none;transition:background .15s,color .15s}
.social a:hover,.social a:focus-visible{background:var(--rose);color:var(--card)}
.social svg{width:18px;height:18px;fill:currentColor}
.title{font-weight:800;font-size:.98rem;padding:10px 14px;background:var(--rose);color:var(--card)}
.donate{padding:16px;text-align:center}
.qr{width:200px;height:200px;margin:0 auto;border:2px dashed var(--rose);border-radius:14px;display:grid;place-items:center;overflow:hidden;background:#fff}
.qr img{width:100%;height:100%;object-fit:contain}
.qrimg{width:100%;max-width:340px;display:block;margin:0 auto;border:2px solid var(--rose);border-radius:14px}
.vids{display:flex;gap:10px;overflow-x:auto;padding:12px;scroll-snap-type:x mandatory}
.vids iframe{flex:0 0 170px;height:300px;border:2px solid var(--rose);border-radius:12px;scroll-snap-align:start;background:#000}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--rose);border-bottom:2px solid var(--rose)}
.grid4 img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.donate p{font-weight:700;font-size:1rem!important;color:var(--rose-d)!important;font-size:.88rem;color:var(--muted);margin-top:10px}
.btn{display:inline-block;margin-top:10px;padding:9px 18px;border:2px solid var(--rose);border-radius:12px;color:var(--rose-d);font-weight:700;font-size:.9rem;text-decoration:none}
.btn:hover,.btn:focus-visible{background:var(--rose);color:var(--card)}
.item{display:flex;flex-direction:column;text-decoration:none;color:inherit}
.item>img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-bottom:2px solid var(--rose)}
.item span{padding:12px 14px;font-weight:700;font-size:.95rem}
.item:hover span,.item:focus-visible span{background:var(--rose-l)}
:focus-visible{outline:3px solid var(--rose-d);outline-offset:2px}
footer{text-align:center;font-size:.78rem;color:var(--muted)}
</style>
</head>
